# Maandelijkse dienstregeling-check.
#
# GVB publiceert seizoenswijzigingen (zomer-/winterdienst) in het landelijke
# GTFS-feed. De app scheept een statische snapshot (src/data/timetable.json)
# mee, dus die veroudert stilletjes. Deze workflow regenereert de snapshot
# elke maand en pusht alleen als er echt iets veranderd is; Vercel deployt
# dan vanzelf. De zomertijd/wintertijd-KLOK is hier geen onderdeel van: die
# gaat runtime automatisch goed via Intl met Europe/Amsterdam (src/lib/time.ts).
#
# Daarnaast draait hier een wekelijkse keep-alive: één lichte SELECT op
# Supabase, zodat het gratis project niet opnieuw wegens inactiviteit pauzeert
# (dat gebeurde in augustus 2026 en kostte vijf weken metingen).
#
# Handmatig draaien kan altijd via "Run workflow" (workflow_dispatch); dan
# draaien beide taken, handig om ze te testen.
name: Dienstregeling verversen

on:
  schedule:
    # Elke 1e van de maand om 04:12 UTC (rustig tijdstip, niet op het hele uur
    # zodat we niet meepieken met ieders cron-jobs richting de GTFS-server).
    - cron: '12 4 1 * *'
    # Elke maandag 06:00 UTC: keep-alive tegen het pauzeren van het project.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    # Alleen op de maandelijkse cron (en bij handmatig draaien), niet op de
    # wekelijkse keep-alive-cron.
    if: github.event_name != 'schedule' || github.event.schedule == '12 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenereer timetable.json uit het verse GTFS-feed
        run: python3 scripts/generate-timetable.py

      - name: Sanity-check (nooit een kapotte dienstregeling pushen)
        run: |
          python3 - <<'EOF'
          import json, sys
          t = json.load(open('src/data/timetable.json'))
          lines = t['lines']
          sailings = sum(len(v) for v in t['schedule'].values())
          problems = []
          if len(lines) < 7:
              problems.append(f'te weinig lijnen: {len(lines)}')
          if sailings < 5000:
              problems.append(f'verdacht weinig afvaarten/week: {sailings}')
          for name, l in lines.items():
              if len(l.get('connects', [])) != 2:
                  problems.append(f'lijn {name} heeft geen 2 steigers')
          if problems:
              print('GEWEIGERD:', '; '.join(problems))
              sys.exit(1)
          print(f'OK: {len(lines)} lijnen, {sailings} afvaarten/week, gegenereerd {t["generated"]}')
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build en tests (vangt schema-breuken in de nieuwe data)
        run: |
          npm ci
          npx vitest run
          npm run build

      - name: Commit en push alleen bij een echte wijziging
        run: |
          # Het 'generated'-veld verandert bij elke run; vergelijk de inhoud
          # zonder dat veld, anders committen we elke maand alleen een datum.
          # De check staat IN de if-conditie: Actions draait bash met -e, dus
          # een losse niet-nul exit zou de stap anders meteen afbreken.
          if python3 - <<'EOF'
          import json, subprocess, sys
          new = json.load(open('src/data/timetable.json'))
          old_raw = subprocess.run(
              ['git', 'show', 'HEAD:src/data/timetable.json'],
              capture_output=True, text=True, check=True).stdout
          old = json.loads(old_raw)
          old.pop('generated', None); new.pop('generated', None)
          sys.exit(1 if old != new else 0)
          EOF
          then
            echo "Dienstregeling inhoudelijk ongewijzigd; niets te pushen."
            git checkout -- src/data/timetable.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/timetable.json
          git commit -m "Dienstregeling automatisch ververst (maandelijkse GTFS-check)"
          git push

  keepalive:
    # Alleen op de wekelijkse cron (en bij handmatig draaien). Houdt het gratis
    # Supabase-project wakker met één lichte, RLS-afgeschermde SELECT.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (lichte SELECT)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Zet de repo-secrets SUPABASE_URL en SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions). De anon-sleutel staat sowieso al publiek in de app-bundle, dus dit geeft geen extra toegang."
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/analytics_events?select=count"
          # Anon mag door RLS niets lezen; de query raakt Postgres wél, en dat
          # is precies wat telt als activiteit. Body is dus [{"count":0}].
          code=$(curl -sS --max-time 30 -o body.txt -w '%{http_code}' "$url" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          body=$(head -c 200 body.txt)
          echo "Keep-alive $(date -u '+%Y-%m-%d %H:%M UTC') -> HTTP ${code} ${body}"
          {
            echo "### Supabase keep-alive"
            echo ""
            echo "- Tijd: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- HTTP: \`${code}\`"
            echo "- Antwoord: \`${body}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase antwoordde niet met 200. Staat het project misschien gepauzeerd?"
            exit 1
          fi
          echo "Project is wakker."
